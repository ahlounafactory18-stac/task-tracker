name: CI

# Run on every push and pull request so no change merges without a green suite.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Install & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Verify a clean install of the declared dependencies succeeds.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Model contract gate: exits non-zero if any of the 8 checks fail.
      - name: Model verification checks
        run: python -m tests.verify_a

      # Full API suite. A single failing test fails the job (and blocks merge).
      - name: Run tests
        run: pytest tests/ -v

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Actually build the backend image from the Dockerfile.
      - name: Build image
        run: docker build -t task-tracker:ci .

      # Actually run the container, detached, publishing the API port.
      - name: Run container
        run: docker run -d --name task-tracker -p 8000:8000 task-tracker:ci

      # Real smoke test: poll the live /health endpoint and print the response.
      - name: Curl /health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "HEALTH CHECK PASSED"
              exit 0
            fi
            echo "waiting for container... ($i)"
            sleep 2
          done
          echo "HEALTH CHECK FAILED"
          docker logs task-tracker
          exit 1

      # Print the container logs as part of the run record.
      - name: Container logs
        if: always()
        run: docker logs task-tracker

      - name: Stop container
        if: always()
        run: docker rm -f task-tracker
