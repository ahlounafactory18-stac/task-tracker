name: CI

# Run on every push and pull request so no change merges without a green suite.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Install & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Verify a clean install of the declared dependencies succeeds.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Model contract gate: exits non-zero if any of the 8 checks fail.
      - name: Model verification checks
        run: python -m tests.verify_a

      # Full API suite. A single failing test fails the job (and blocks merge).
      - name: Run tests
        run: pytest tests/ -v
